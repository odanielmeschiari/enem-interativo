<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador ENEM 2025</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Explorador ENEM 2025</h1></header>
<main>
  <section id="load" class="card">
    <h2>1. Escolha o arquivo de dados</h2>
    <input type="file" id="file" accept=".csv">
    <progress id="bar" value="0" max="1" hidden></progress>
    <p id="status">Nenhum arquivo carregado.</p>
    <button id="release" hidden>Liberar dados da memória</button>
  </section>
  <div id="work" class="grid" hidden>
    <section class="card">
      <h2>2. Filtros <button id="clear">Limpar tudo</button></h2>
      <form id="f" onsubmit="return false">
        <h3>Município da prova</h3>
        <div class="ac"><input type="search" id="mq" placeholder="Digite o nome de um município…" autocomplete="off"><div id="sug"></div></div>
        <div id="mchips" class="chips"></div>
        <h3>Estados (UF da prova)</h3>
        <div id="ufs" class="chips"></div>
        <h3>Notas (mínimo e máximo)</h3>
        <div id="scores" class="scores"></div>
        <h3>Identificação (valor exato)</h3>
        <label>Nº sequencial <input type="number" id="NU_SEQUENCIAL" min="0"></label>
        <label>Código da escola <input type="number" id="CO_ESCOLA" min="0"></label>
        <div id="groups"></div>
      </form>
    </section>
    <aside class="card result">
      <h2>Resultado</h2>
      <p class="big"><span id="count">–</span> <small>candidatos</small></p>
      <p id="pct"></p>
      <p id="ms"></p>
    </aside>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
